name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest discover -s tests

      - name: Write coverage report
        run: |
          python -m coverage report
          python -m coverage json -o coverage.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json

  coverage-badge:
    needs: test
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-json

      - name: Update coverage badge
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          coverage = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          percent = round(coverage["totals"]["percent_covered"])
          color = "brightgreen" if percent >= 90 else "green" if percent >= 80 else "yellow" if percent >= 70 else "orange" if percent >= 60 else "red"
          badge = f"![Coverage](https://img.shields.io/badge/coverage-{percent}%25-{color})"

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          updated = re.sub(
              r"!\[Coverage\]\(https://img\.shields\.io/badge/coverage-[^)]+\)",
              badge,
              content,
              count=1,
          )
          if updated == content:
              raise SystemExit("README.md coverage badge was not found")
          readme.write_text(updated, encoding="utf-8")
          PY

      - name: Commit coverage badge
        run: |
          if git diff --quiet README.md; then
            echo "Coverage badge already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update coverage badge [skip ci]"
            git push
          fi